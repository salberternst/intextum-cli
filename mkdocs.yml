site_name: intextum-cli
site_description: Classify documents, extract structured fields, and review evidence locally.
repo_url: https://github.com/salberternst/intextum-cli
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Guides:
      - Grouping documents: guides/grouping.md
      - Document conversion: guides/conversion.md
      - Writing schemas: guides/schemas.md
      - Attachments: guides/attachments.md
      - Verification: guides/verification.md
      - Reviewing results: guides/review.md
  - Reference:
      - CLI: reference/cli.md
      - Workspace and exports: reference/workspace.md
      - Extraction and model calls: reference/extraction.md
  - Development: development.md

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
