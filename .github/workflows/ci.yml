name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan history and tracked snapshot
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow
          mkdir -p "$RUNNER_TEMP/tracked-snapshot"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/tracked-snapshot"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/tracked-snapshot" --redact=100 --no-banner --ignore-gitleaks-allow --max-archive-depth=3

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              requirements = tomllib.load(stream)["project"]["optional-dependencies"]["docs"]
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - name: Build documentation and validate links
        run: .venv/bin/python -m mkdocs build --strict

  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development and UI dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/python -m pip install -e ".[dev,ui]"
      - name: Lint and check formatting
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src tests
      - name: Validate example and corpus schemas
        run: |
          .venv/bin/intextum check-schemas examples/schemas
          .venv/bin/intextum check-schemas corpus/schemas
      - name: Run deterministic tests
        run: .venv/bin/python -m pytest

  wheel:
    name: Installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m venv "$RUNNER_TEMP/intextum-build"
          "$RUNNER_TEMP/intextum-build/bin/python" -m pip install build
          "$RUNNER_TEMP/intextum-build/bin/python" -m build
      - name: Install wheel with UI extras in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/intextum-wheel"
          "$RUNNER_TEMP/intextum-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/intextum-wheel/bin/python" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/intextum-wheel/bin/python" -m pip install "${wheels[0]}[ui]"
      - name: Smoke-test installed CLI, workspace, and viewer assets
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/intextum-wheel/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py"'

  frontend:
    name: Reproducible viewer bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rebuild pinned components
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Verify shipped bundle and license notices
        run: git diff --exit-code -- src/intextum_cli/static/vendor/
